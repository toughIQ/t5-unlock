name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.5
      - run: ruff check linux
      - run: python linux/test_offline.py
      - run: python linux/test_mock_drive.py
      - run: python linux/test_flow.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install libusb cppcheck
      - name: selftest, strict warnings, sanitizers, cppcheck
        run: make -C macos check
      - name: static build
        run: make -C macos static

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.24.1
      - name: link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 20 './**/*.md'
          fail: true

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
