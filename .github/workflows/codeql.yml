name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: c-cpp
            os: macos-latest
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - name: install libusb
        if: matrix.build-mode == 'manual'
        run: brew install libusb
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: build
        if: matrix.build-mode == 'manual'
        run: make -C macos
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
